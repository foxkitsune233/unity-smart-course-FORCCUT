<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>我的任务 · Unity研习室</title><link rel="stylesheet" href="portal.css"><link rel="stylesheet" href="teaching.css"><link rel="stylesheet" href="teaching-flow.css"><link rel="stylesheet" href="app-shell.css"></head><body class="home-page"><a class="skip-link" href="#main-content">跳到任务列表</a><aside class="sidebar"><a class="brand" href="./" aria-label="Unity 研习室首页"><span class="brand-symbol" aria-hidden="true">U<span>·</span></span><span><strong>Unity 研习室</strong><small>LEARN · TEST · BUILD</small></span></a><p class="nav-caption">学习空间 / WORKSPACE</p><nav aria-label="主要导航"><a class="nav-link" href="./"><span data-icon="home" aria-hidden="true"></span><span>学习首页</span></a><a class="nav-link" href="tasks.html"><span data-icon="check" aria-hidden="true"></span><span>我的任务</span></a><a id="nav-lab" class="nav-link" href="/lab/" target="_blank" rel="noopener"><span data-icon="cube" aria-hidden="true"></span><span>实操实验</span><span class="nav-external" data-icon="external" aria-hidden="true"></span></a></nav><div class="sidebar-note"><span class="sidebar-note-icon" data-icon="layers" aria-hidden="true"></span><strong>任务来自你的教学班</strong><p>老师发布的任务会出现在这里，提交后会收到量规评分与评语。</p></div><div class="sidebar-foot"><span class="small-dot"></span>学习记录按账号保存</div></aside><div class="home-workspace"><header class="portal-topbar"><div class="breadcrumb"><span>智慧课程</span><span>/</span><strong>我的任务</strong></div><div class="topbar-actions"><span class="profile"><span class="avatar">学</span><span id="account-name">学习者</span></span></div></header><main id="main-content" class="home-content"><div id="page-notice" class="notice" hidden></div><div id="tasks-view" aria-live="polite"><div class="loading-state">正在读取任务…</div></div></main></div><dialog id="submit-dialog" class="modal"><div class="modal-heading"><h2 id="submit-title">提交任务</h2><button id="cancel-submit" class="icon-button" type="button" aria-label="关闭提交">×</button></div><p class="muted small">提交后可在截止时间前重做；每次提交都会保留为独立版本，最终成绩以最新一次为准。</p><div id="submit-error" class="notice error" role="alert" hidden></div><form id="submit-form"><input type="hidden" name="taskId"><div id="submit-rubric" class="submit-rubric"></div><label class="field"><span>实验说明</span><textarea name="note" rows="4" placeholder="说明你的思路、遇到的问题与验证结果"></textarea></label><label class="field"><span>场景数据（JSON，可选）</span><textarea name="sceneJson" rows="4" placeholder="从实验台导出的场景 JSON；留空表示仅提交文字说明" spellcheck="false"></textarea></label><div class="form-footer"><button class="button primary" type="submit">提交</button></div></form></dialog><dialog id="appeal-dialog" class="modal"><div class="modal-heading"><h2>成绩复核申请</h2><button id="cancel-appeal" class="icon-button" type="button" aria-label="关闭复核申请">×</button></div><p class="muted small" id="appeal-target">请写清你认为哪一项得分与评分标准不符。老师处理后会给出说明；若改分，分项与总评会同步更新。</p><div id="appeal-error" class="notice error" role="alert" hidden></div><form id="appeal-form"><input type="hidden" name="submissionId"><label class="field"><span>复核理由</span><textarea name="reason" rows="5" minlength="5" maxlength="1000" required placeholder="例如：量规第二条要求「脚本挂载正确」，我已挂载 Collectible 并绑定计分器，但该项只给了 5 分（满分 20）"></textarea></label><div class="form-footer"><button class="button primary" type="submit">提交复核申请</button></div></form></dialog><script type="module" src="tasks.mjs"></script></body></html>
